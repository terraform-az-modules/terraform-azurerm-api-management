# Name of this project
name : Terraform Azure API Management Module

# License of this project
license: "APACHE"

# Canonical GitHub repo
github_repo: terraform-az-modules/terraform-azurerm-api-management

# Badges to display
badges:
  - name: "Terraform"
    image: "https://img.shields.io/badge/Terraform-v0.13-green"
    url: "https://www.terraform.io"
  - name: "Licence"
    image: "https://img.shields.io/badge/License-APACHE-blue.svg"
    url: "LICENSE.md"
  - name: "Changelog"
    image: "https://img.shields.io/badge/Changelog-blue"
    url: "CHANGELOG.md"

# Prerequesties to display
prerequesties:
  - name: Terraform
    url: https://learn.hashicorp.com/terraform/getting-started/install.html
    version: ">= 1.6.6"

providers:
  - name: azurerm
    url: https://registry.terraform.io/providers/hashicorp/azurerm/latest
    version: ">= 3.116.0"

#  description of this project
description: |-
  Terraform module to provision an Azure API Management service with optional
  diagnostics, Application Insights logging, virtual network integration, and
  service policy support.

# How to use this project
# How to use this project
usage: |-
  ```hcl
  module "api_management" {
    source              = "terraform-az-modules/api-management/azurerm"
    version             = "x.y.z"
    name                = "core"
    environment         = "dev"
    location            = "centralus"
    resource_group_name = "rg-core-dev-centralus"
    publisher_name      = "Example"
    publisher_email     = "example@contoso.com"
    sku_name            = "Developer_1"
  }
  ```
